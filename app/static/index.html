<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Certificate Generator</title>
    <style>
        :root {
            --accent: #b45309;
            --accent-hover: #92400e;
            --accent-light: #fef3c7;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --failed: #ef4444;
            --pending: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 30px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 28px;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            color: var(--accent);
        }

        .links {
            display: flex;
            gap: 16px;
        }

        .links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.15s;
        }

        .links a:hover {
            color: var(--text-main);
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
            padding: 0;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .tab-btn {
            background: #0f172a;
            border: 1px solid var(--surface-border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .tab-btn.active {
            background: var(--surface-border);
            color: var(--text-main);
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 140px;
            background-color: #0b1120;
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            padding: 12px;
            color: #e2e8f0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .helper-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 14px;
            transition: background 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Status & Progress */
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .job-meta {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            color: var(--text-muted);
        }

        .badge {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-pending { background: #78350f; color: #fde68a; }
        .badge-processing { background: #1e3a8a; color: #93c5fd; }
        .badge-completed { background: #064e3b; color: #6ee7b7; }
        .badge-completed-with-errors { background: #7c2d12; color: #fdba74; }
        .badge-failed { background: #7f1d1d; color: #fca5a5; }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #0b1120;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }

        .counters {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .counters strong {
            color: var(--text-main);
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th {
            background-color: #0b1120;
            color: var(--text-muted);
            font-weight: 600;
            padding: 10px 12px;
            border-bottom: 1px solid var(--surface-border);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--surface-border);
            vertical-align: middle;
        }

        .monospace {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .btn-download {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            transition: all 0.15s;
        }

        .btn-download:hover {
            background-color: var(--accent);
            color: #ffffff;
        }

        .text-error {
            color: var(--failed);
            font-size: 12px;
            margin-top: 4px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bulk <span>Certificate</span> Generator</h1>
            <div class="links">
                <a href="/docs" target="_blank">Swagger Docs</a>
                <a href="/health" target="_blank">Health</a>
            </div>
        </header>

        <!-- Submission Card -->
        <div class="card">
            <div class="card-title">
                <span>1. Submit Batch of Recipients</span>
                <button class="btn-link" onclick="loadSampleData()">Load Sample Recipients</button>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" id="tab-csv" onclick="setMode('csv')">CSV Format</button>
                <button class="tab-btn" id="tab-json" onclick="setMode('json')">JSON Format</button>
            </div>

            <textarea id="recipients-input" placeholder="Name, Email&#10;Ada Lovelace, ada@example.com&#10;Alan Turing, alan@example.com"></textarea>
            <p class="helper-text" id="format-hint">Format: <code>Name, Email</code> (one recipient per row)</p>

            <button id="btn-submit" class="btn-primary" onclick="submitJob()">
                Generate Certificates
            </button>
        </div>

        <!-- Job Status & Progress Card -->
        <div id="status-card" class="card hidden">
            <div class="status-header">
                <div>
                    <span class="job-meta">Job ID: <span id="display-job-id">-</span></span>
                </div>
                <div id="display-status-badge" class="badge badge-pending">PENDING</div>
            </div>

            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div class="counters">
                <div>Total: <strong id="count-total">0</strong></div>
                <div>Success: <strong id="count-success" style="color: var(--success);">0</strong></div>
                <div>Failed: <strong id="count-failed" style="color: var(--failed);">0</strong></div>
            </div>

            <div class="card-title" style="margin-top: 20px;">
                <span>Generated Records</span>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Record ID</th>
                            <th>Recipient Name</th>
                            <th>Status</th>
                            <th>Certificate Action</th>
                        </tr>
                    </thead>
                    <tbody id="records-tbody">
                        <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No records loaded yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'csv';
        let activeJobId = null;
        let pollTimer = null;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tab-csv').classList.toggle('active', mode === 'csv');
            document.getElementById('tab-json').classList.toggle('active', mode === 'json');
            const hint = document.getElementById('format-hint');
            const input = document.getElementById('recipients-input');

            if (mode === 'csv') {
                hint.innerHTML = 'Format: <code>Name, Email</code> (one recipient per row)';
                input.placeholder = "Name, Email\nAda Lovelace, ada@example.com\nAlan Turing, alan@example.com";
            } else {
                hint.innerHTML = 'Format: <code>[{"name": "...", "email": "..."}, ...]</code>';
                input.placeholder = '[\n  {"name": "Ada Lovelace", "email": "ada@example.com"},\n  {"name": "Alan Turing", "email": "alan@example.com"}\n]';
            }
        }

        function loadSampleData() {
            if (currentMode === 'csv') {
                document.getElementById('recipients-input').value = 
`Ada Lovelace, ada@example.com
Alan Turing, alan@example.com
Grace Hopper, grace@navy.mil
Katherine Johnson, katherine@nasa.gov
Margaret Hamilton, margaret@mit.edu`;
            } else {
                document.getElementById('recipients-input').value = JSON.stringify([
                    {"name": "Ada Lovelace", "email": "ada@example.com"},
                    {"name": "Alan Turing", "email": "alan@example.com"},
                    {"name": "Grace Hopper", "email": "grace@navy.mil"},
                    {"name": "Katherine Johnson", "email": "katherine@nasa.gov"},
                    {"name": "Margaret Hamilton", "email": "margaret@mit.edu"}
                ], null, 2);
            }
        }

        function parseRecipients() {
            const raw = document.getElementById('recipients-input').value.trim();
            if (!raw) throw new Error("Please enter recipient data.");

            if (currentMode === 'json') {
                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed) || parsed.length === 0) {
                    throw new Error("JSON must be a non-empty array of objects with a 'name' field.");
                }
                return parsed;
            }

            // CSV Parsing
            const lines = raw.split('\n');
            const recipients = [];
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                const parts = line.split(',');
                const name = parts[0]?.trim();
                const email = parts[1]?.trim() || null;
                if (!name || name.toLowerCase() === 'name') continue; // skip empty or header
                recipients.push({ name, email });
            }

            if (recipients.length === 0) {
                throw new Error("No valid recipients found in CSV input.");
            }
            return recipients;
        }

        async function submitJob() {
            const btn = document.getElementById('btn-submit');
            try {
                const recipients = parseRecipients();
                btn.disabled = true;
                btn.innerText = "Submitting...";

                const res = await fetch('/api/jobs/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recipients })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail ? JSON.stringify(err.detail) : "Submission failed.");
                }

                const data = await res.json();
                activeJobId = data.job_id;

                document.getElementById('status-card').classList.remove('hidden');
                document.getElementById('display-job-id').innerText = activeJobId;
                updateBadge(data.status);

                startPolling(activeJobId);
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Certificates";
            }
        }

        function updateBadge(status) {
            const badge = document.getElementById('display-status-badge');
            badge.innerText = status;
            badge.className = 'badge';
            if (status === 'PENDING') badge.classList.add('badge-pending');
            else if (status === 'PROCESSING') badge.classList.add('badge-processing');
            else if (status === 'COMPLETED') badge.classList.add('badge-completed');
            else if (status === 'COMPLETED_WITH_ERRORS') badge.classList.add('badge-completed-with-errors');
            else badge.classList.add('badge-failed');
        }

        function startPolling(jobId) {
            if (pollTimer) clearInterval(pollTimer);
            pollStatusAndRecords(jobId);
            pollTimer = setInterval(() => pollStatusAndRecords(jobId), 1000);
        }

        async function pollStatusAndRecords(jobId) {
            try {
                const [jobRes, recRes] = await Promise.all([
                    fetch(`/api/jobs/${jobId}/`),
                    fetch(`/api/jobs/${jobId}/records/`)
                ]);

                if (!jobRes.ok || !recRes.ok) return;

                const job = await jobRes.json();
                const records = await recRes.json();

                updateBadge(job.status);
                document.getElementById('count-total').innerText = job.total_count;
                document.getElementById('count-success').innerText = job.success_count;
                document.getElementById('count-failed').innerText = job.failure_count;

                const processed = job.success_count + job.failure_count;
                const pct = job.total_count > 0 ? (processed / job.total_count) * 100 : 0;
                document.getElementById('progress-bar').style.width = pct + '%';

                renderRecords(records);

                if (job.status === 'COMPLETED' || job.status === 'COMPLETED_WITH_ERRORS' || job.status === 'FAILED') {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }
            } catch (err) {
                console.error("Polling error:", err);
            }
        }

        function renderRecords(records) {
            const tbody = document.getElementById('records-tbody');
            if (!records || records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No records yet.</td></tr>';
                return;
            }

            tbody.innerHTML = records.map(r => {
                let statusBadge = `<span class="badge badge-pending">PENDING</span>`;
                if (r.status === 'SUCCESS') statusBadge = `<span class="badge badge-completed">SUCCESS</span>`;
                if (r.status === 'FAILED') statusBadge = `<span class="badge badge-failed">FAILED</span>`;

                let action = `<span style="color: var(--text-muted);">Processing...</span>`;
                if (r.status === 'SUCCESS') {
                    action = `<a href="/api/certificates/${r.record_id}/download/" class="btn-download" target="_blank" download>Download PDF</a>`;
                } else if (r.status === 'FAILED') {
                    action = `<span class="text-error">${r.error_message || 'Failed'}</span>`;
                }

                return `
                    <tr>
                        <td class="monospace" style="color: var(--text-muted);">${r.record_id.substring(0, 8)}...</td>
                        <td><strong>${r.recipient_name}</strong></td>
                        <td>${statusBadge}</td>
                        <td>${action}</td>
                    </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>
